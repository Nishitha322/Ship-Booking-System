<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — AuraCruises</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-page="login">

    <header class="header">
        <div class="nav-container">
            <a href="index.html" class="logo-container">
                <svg class="logo-icon" viewBox="0 0 24 24">
                    <path d="M2 21h20M19.3 12H4.7c-.5 0-.9-.3-1-.8L2.1 6.1C2 5.5 2.4 5 3 5h18c.6 0 1 .5.9 1.1l-1.6 5.1c-.1.5-.5.8-1 .8zM12 2v3M8 3v2M16 3v2" stroke="currentColor" stroke-width="2" fill="none"/>
                </svg>
                <span class="logo-text">AuraCruises</span>
            </a>
            <nav>
                <ul class="nav-menu" id="nav-menu"></ul>
            </nav>
        </div>
    </header>

    <main class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <h1 class="auth-title">Welcome Back</h1>
                <p class="auth-subtitle">Log in to manage your maritime voyages</p>
            </div>
            <form class="auth-form" id="login-form">
                <div class="form-group">
                    <label for="login-email">Email Address</label>
                    <input type="email" id="login-email" class="form-input" placeholder="name@domain.com" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" class="form-input" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-submit" id="btn-login-submit">Login Account</button>
            </form>
            <div class="auth-footer">
                Don't have an account? <a href="register.html">Register now</a>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-bottom">
            <p>&copy; 2026 AuraCruises. All rights reserved.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
