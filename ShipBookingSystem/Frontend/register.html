<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — AuraCruises</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-page="register">

    <header class="header">
        <div class="nav-container">
            <a href="index.html" class="logo-container">
                <svg class="logo-icon" viewBox="0 0 24 24">
                    <path d="M2 21h20M19.3 12H4.7c-.5 0-.9-.3-1-.8L2.1 6.1C2 5.5 2.4 5 3 5h18c.6 0 1 .5.9 1.1l-1.6 5.1c-.1.5-.5.8-1 .8zM12 2v3M8 3v2M16 3v2" stroke="currentColor" stroke-width="2" fill="none"/>
                </svg>
                <span class="logo-text">AuraCruises</span>
            </a>
            <nav>
                <ul class="nav-menu" id="nav-menu"></ul>
            </nav>
        </div>
    </header>

    <main class="auth-wrapper">
        <div class="auth-card" style="max-width: 600px;">
            <div class="auth-header">
                <h1 class="auth-title">Create Account</h1>
                <p class="auth-subtitle">Register your passport details to book cabins</p>
            </div>
            <form class="auth-form" id="register-form">
                <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem;">
                    <div class="form-group">
                        <label for="reg-name">Full Name</label>
                        <input type="text" id="reg-name" class="form-input" placeholder="Rahul Sharma" required>
                    </div>
                    <div class="form-group">
                        <label for="reg-email">Email Address</label>
                        <input type="email" id="reg-email" class="form-input" placeholder="name@domain.com" required>
                    </div>
                </div>
                <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem;">
                    <div class="form-group">
                        <label for="reg-phone">Phone Number</label>
                        <input type="tel" id="reg-phone" class="form-input" placeholder="e.g. 9876543210" required>
                    </div>
                    <div class="form-group">
                        <label for="reg-nationality">Nationality</label>
                        <input type="text" id="reg-nationality" class="form-input" placeholder="e.g. Indian" required>
                    </div>
                </div>
                <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem;">
                    <div class="form-group">
                        <label for="reg-passport">Passport Number</label>
                        <input type="text" id="reg-passport" class="form-input" placeholder="e.g. N1234567" required>
                    </div>
                    <div class="form-group">
                        <label for="reg-password">Password</label>
                        <input type="password" id="reg-password" class="form-input" placeholder="••••••••" required>
                    </div>
                </div>
                <button type="submit" class="btn-submit" id="btn-register-submit">Register Account</button>
            </form>
            <div class="auth-footer">
                Already registered? <a href="login.html">Log in here</a>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-bottom">
            <p>&copy; 2026 AuraCruises. All rights reserved.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
